[env:uno]
platform = atmelavr
board = uno
framework = arduino
lib_deps = 
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.3
    paulstoffregen/OneWire@^2.3.7
    milesburton/DallasTemperature@^3.9.1
    seeed-studio/Seeed_Arduino_NFC@^2.0.0

monitor_speed = 9600
upload_speed = 115200

; 优化设置
build_flags = 
    -Os
    -Wall
    -Werror
    -Wno-unused-function
